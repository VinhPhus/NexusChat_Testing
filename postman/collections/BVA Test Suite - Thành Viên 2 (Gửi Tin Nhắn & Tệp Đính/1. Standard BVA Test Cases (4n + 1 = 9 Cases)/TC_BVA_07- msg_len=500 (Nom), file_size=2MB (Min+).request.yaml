$kind: http-request
name: "TC_BVA_07: msg_len=500 (Nom), file_size=2MB (Min+)"
url: "{{baseUrl}}/api/messages/direct"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "recipientId": "{{receiverId}}",
      "content": "{{msg500}}",
      "fileUrl": "https://drive.google.com/test_2mb.pdf",
      "fileName": "doc_2mb.pdf",
      "fileSize": 2097152
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201 - Gửi thành công tệp 2MB", function () {
          pm.response.to.have.status(201);
      });
      var jsonData = pm.response.json();
      pm.expect(jsonData.message.fileSize).to.eql(2097152);
    language: text/javascript
order: 7000
