$kind: http-request
name: "TC_BVA_05: msg_len=2000 (Max), file_size=10MB (Nom)"
url: "{{baseUrl}}/api/messages/direct"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "recipientId": "{{receiverId}}",
      "content": "{{msg2000}}",
      "fileUrl": "https://drive.google.com/test_10mb.pdf",
      "fileName": "doc_10mb.pdf",
      "fileSize": 10485760
    }
scripts:
  - type: beforeRequest
    code: |-
      var str2000 = "B".repeat(2000);
      pm.collectionVariables.set("msg2000", str2000);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 201 - Chấp nhận tối đa 2000 ký tự", function () {
          pm.response.to.have.status(201);
      });
      var jsonData = pm.response.json();
      pm.expect(jsonData.message.content.length).to.eql(2000);
    language: text/javascript
order: 5000
