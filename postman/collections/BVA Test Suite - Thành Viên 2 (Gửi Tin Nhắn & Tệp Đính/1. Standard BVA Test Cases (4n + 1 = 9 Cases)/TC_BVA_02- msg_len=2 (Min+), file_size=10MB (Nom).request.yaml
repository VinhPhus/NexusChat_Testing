$kind: http-request
name: "TC_BVA_02: msg_len=2 (Min+), file_size=10MB (Nom)"
url: "{{baseUrl}}/api/messages/direct"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "recipientId": "{{receiverId}}",
      "content": "OK",
      "fileUrl": "https://drive.google.com/test_10mb.pdf",
      "fileName": "doc_10mb.pdf",
      "fileSize": 10485760
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201 - Gửi thành công tin nhắn 2 ký tự kèm tệp 10MB", function () {
          pm.response.to.have.status(201);
      });
      var jsonData = pm.response.json();
      pm.expect(jsonData.message.content).to.eql("OK");
    language: text/javascript
order: 2000
