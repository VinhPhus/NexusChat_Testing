$kind: http-request
name: "TC_BVA_03: msg_len=500 (Nom), file_size=10MB (Nom) [Baseline]"
url: "{{baseUrl}}/api/messages/direct"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "recipientId": "{{receiverId}}",
      "content": "{{msg500}}",
      "fileUrl": "https://drive.google.com/test_10mb.pdf",
      "fileName": "doc_10mb.pdf",
      "fileSize": 10485760
    }
scripts:
  - type: beforeRequest
    code: |-
      var str500 = "X".repeat(500);
      pm.collectionVariables.set("msg500", str500);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 201 - Baseline Test Case thành công", function () {
          pm.response.to.have.status(201);
      });
      var jsonData = pm.response.json();
      pm.expect(jsonData.message.content.length).to.eql(500);
    language: text/javascript
order: 3000
